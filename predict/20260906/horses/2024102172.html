    // パース中のdocument.writeは追記になるため、パース完了を待ってから全置換する
    function doShow() {
      document.open();
      document.write(html);
      document.close();
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", doShow);
    } else {
      doShow();
    }
  }
  var saved = null;
  try { saved = localStorage.getItem(SS); } catch (e) {}
  if (saved) {
    var raw = unhex(saved).buffer;
    tryKey(raw).then(function(html) { show(html, raw); })
      .catch(function() { try { localStorage.removeItem(SS); } catch (e) {} });
  }
  document.getElementById("f").addEventListener("submit", function(ev) {
    ev.preventDefault();
    var btn = document.getElementById("btn");
    var err = document.getElementById("err");
    btn.disabled = true; err.textContent = "";
    deriveBits(document.getElementById("pw").value).then(function(raw) {
      return tryKey(raw).then(function(html) { show(html, raw); });
    }).catch(function() {
      err.textContent = "パスワードが違います";
      btn.disabled = false;
    });
  });
})();
</script>
