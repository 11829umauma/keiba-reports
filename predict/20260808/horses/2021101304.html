  var SS = "keiba_site_key";
  function b64(s) {
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);

  function hex(a) {

  function unhex(s) {
    var a = new Uint8Array(s.length / 2);
