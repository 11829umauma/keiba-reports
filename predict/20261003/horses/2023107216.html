  function hex(a) {
    return Array.from(new Uint8Array(a)).map(function(x) {
      return x.toString(16).padStart(2, "0"); }).join("");
  }
  function unhex(s) {
    var a = new Uint8Array(s.length / 2);
    for (var i = 0; i < a.length; i++) a[i] = parseInt(s.substr(i * 2, 2), 16);
    return a;
  }
  async function deriveBits(pw) {
    var km = await crypto.subtle.importKey("raw",
      new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return crypto.subtle.deriveBits(
      {name: "PBKDF2", salt: b64(SALT), iterations: ITERS, hash: "SHA-256"},
      km, 256);
  }
  async function tryKey(raw) {
    var key = await crypto.subtle.importKey("raw", raw,
      {name: "AES-GCM"}, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt(
      {name: "AES-GCM", iv: b64(IV)}, key, b64(CT));
    return new TextDecoder().decode(pt);
  }
  function show(html, raw) {
    try { localStorage.setItem(SS, hex(raw)); } catch (e) {}
    // パース中のdocument.writeは追記になるため、パース完了を待ってから全置換する
    function doShow() {
      document.open();
      document.write(html);
      document.close();
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", doShow);
    } else {
      doShow();
    }
  }
  var saved = null;
  try { saved = localStorage.getItem(SS); } catch (e) {}
  if (saved) {
    var raw = unhex(saved).buffer;
    tryKey(raw).then(function(html) { show(html, raw); })
      .catch(function() { try { localStorage.removeItem(SS); } catch (e) {} });
  }
  document.getElementById("f").addEventListener("submit", function(ev) {
    ev.preventDefault();
    var btn = document.getElementById("btn");
    var err = document.getElementById("err");
    btn.disabled = true; err.textContent = "";
    deriveBits(document.getElementById("pw").value).then(function(raw) {
      return tryKey(raw).then(function(html) { show(html, raw); });
    }).catch(function() {
      err.textContent = "パスワードが違います";
      btn.disabled = false;
    });
  });
})();
</script>
</body></html>
