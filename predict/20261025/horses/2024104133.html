  var SS = "keiba_site_key";
  function b64(s) {
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;

  function hex(a) {
    return Array.from(new Uint8Array(a)).map(function(x) {
      return x.toString(16).padStart(2, "0"); }).join("");
  }
  function unhex(s) {
    var a = new Uint8Array(s.length / 2);
    for (var i = 0; i < a.length; i++) a[i] = parseInt(s.substr(i * 2, 2), 16);
    return a;
  }

      {name: "AES-GCM"}, false, ["decrypt"]);

    function doShow() {

      document.write(html);

  }
